dependency_overrides:
  firebase_auth: 5.3.1
  firebase_core: 3.6.0
  firebase_messaging: 15.1.3
  firebase_crashlytics: 4.1.3
  google_sign_in: 6.2.1
  google_sign_in_ios: 5.6.5
  flutter_branch_sdk: 7.1.0
  connectivity_plus: 6.1.0
  device_info_plus: 11.0.0
  share_plus: 10.0.2
  package_info_plus: 8.0.2
  shared_preferences: 2.2.2
  path: 1.9.1
  http: 1.0.0
  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/ic_app_logo.webp"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/icons/
    - assets/story_design_icons/
    - assets/images/
    - assets/lottie/
    - assets/effects/
  fonts:
    - family: SfProRegular
      fonts:
        - asset: assets/fonts/Sf-Pro-Regular.OTF
    - family: SfProMedium
      fonts:
        - asset: assets/fonts/Sf-Pro-Medium.OTF
    - family: SfProBold
      fonts:
        - asset: assets/fonts/Sf-Pro-Bold.OTF
